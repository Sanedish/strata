# Runs Strata's tests on a real Linux box (Ubuntu) with a real Caddy, so "tested on Linux" is a fact and not a hope.
# run_all.py needs no Caddy of its own (it uses a stub), but caddy_test.py and anubis_test.py run only when a real one is
# installed, so this installs it. The real-Anubis half of anubis_test.py is skipped here (STRATA_ANUBIS unset).
name: Linux
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Caddy (from its apt repository)
        run: |
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy
          sudo systemctl disable --now caddy
          caddy version
      - run: pip install -r requirements.txt
      - name: Test suites
        run: python tests/run_all.py --offline 2>&1 | tee tests.log
      - name: Demo instance answers
        run: |
          python tests/demo.py > demo.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8290/ && break; sleep 1; done
          curl -fs http://127.0.0.1:8290/ | grep -qi "<title>"
          curl -fs http://127.0.0.1:8290/api/me | grep -q '"user"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs
          path: |
            tests.log
            demo.log
