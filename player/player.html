{{- /*
  Strata audio player: Caddy template, served by an "Audio player" access rule (rules.py render_players) when a
  desktop / tablet browser *navigates* to an audio file. Everything else - the <audio> element, phones, link previews,
  ?dl=1, ?raw=1 - gets the plain file. Caddy hands us three request headers (set by the generated config, never by
  the client): the audio file's folder and the placeholder folder (both drive-relative, for listFiles), and the
  placeholder folder's URL path.
*/ -}}
{{- $bg := .Req.Header.Get "X-Strata-Player-Bg" -}}
{{- $bgUrl := .Req.Header.Get "X-Strata-Player-Bg-Url" -}}
{{- $dir := .Req.Header.Get "X-Strata-Player-Dir" -}}
{{- $bgs := list -}}
{{- if and $bg (fileExists $bg) -}}
  {{- range listFiles $bg -}}{{- if regexMatch `(?i)^[^.].*\.(jpe?g|png|webp|avif)$` . -}}{{- $bgs = append $bgs . -}}{{- end -}}{{- end -}}
{{- end -}}
{{- $covers := list -}}
{{- if and $dir (fileExists $dir) -}}
  {{- range listFiles $dir -}}{{- if regexMatch `(?i)^(cover|folder|front|album|albumart|artwork)\.(jpe?g|png|webp|avif)$` . -}}{{- $covers = append $covers . -}}{{- end -}}{{- end -}}
{{- end -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Player</title>
<!-- Strata audio player (player/player.html). Visualizer: spring-bounce spectrum from the Novise engine. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@800;900&family=Space+Mono:wght@400;700&display=swap">
<style>
:root {
  --ink: #000; --paper: #fff; --red: #d71921; --dim: rgba(255,255,255,.62); --faint: rgba(255,255,255,.22);
  --ring: #fff; --art: min(36vh, 56vw);
  --mono: "Space Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --dot: "Doto", var(--mono);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--paper);
  font: 400 15px/1.4 var(--mono); -webkit-font-smoothing: antialiased; }
body.idle { cursor: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }

/* background: the album art, blurred - or a placeholder wallpaper, cropped to cover */
.bg { position: fixed; inset: -6vmax; background: #000 center / cover no-repeat; opacity: 0;
  filter: blur(5.5vh) saturate(1.3) brightness(.6); transform: translateZ(0); transition: opacity 1.4s ease; }
.bg.ph { inset: 0; filter: brightness(.58); }
.bg.on { opacity: 1; }
.shade { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 0, rgba(0,0,0,.28) 70%),
              linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,0) 30%, rgba(0,0,0,.35) 68%, rgba(0,0,0,.82)); }

/* visualizer: solid bars along the bottom edge, in front of the background */
#viz { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 16vh; pointer-events: none; opacity: 0.8; }

/* corner labels */
.corner { position: fixed; top: 3.2vh; font: 700 max(11px, 1.15vh)/1 var(--mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: .9em; z-index: 3; }
.corner.r { right: 3.4vw; }
.corner a { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--faint); padding-bottom: 2px; }
.corner a:hover { color: var(--paper); border-color: var(--paper); }

/* centre stack, slightly above the middle */
.stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-bottom: 14vh; z-index: 2; pointer-events: none; }
.stage > * { pointer-events: auto; }
.art { position: relative; width: var(--art); height: var(--art); border-radius: calc(var(--art) * .075);
  border: clamp(4px, .62vh, 9px) solid var(--ring); overflow: hidden; background: #0b0b0b;
  box-shadow: 0 3vh 8vh rgba(0,0,0,.55), 0 .6vh 1.6vh rgba(0,0,0,.35);
  transition: border-color .6s ease, transform .12s linear; will-change: transform; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .8s ease; }
.art img.on { opacity: 1; }
.art .fb { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .6s;
  background: radial-gradient(circle, rgba(255,255,255,.16) 1.1px, transparent 1.6px) 0 0 / 12px 12px, #0b0b0b; }
.art .fb span { font: 900 calc(var(--art) * .2)/1 var(--dot); letter-spacing: .04em; color: var(--paper); }
.art.has .fb { opacity: 0; transition: none; }

h1 { margin: 3.4vh 0 0; max-width: 64vw; font: 900 max(26px, 5.2vh)/1.08 var(--dot); letter-spacing: .01em;
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 .3vh 2vh rgba(0,0,0,.4); }
.artist { margin: 1.3vh 0 0; max-width: 56vw; font: 700 max(12px, 1.75vh)/1.2 var(--mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist.err { color: var(--red); }

/* controls: play / pause, progress, loop */
.controls { display: flex; align-items: center; gap: max(14px, 2.2vh); width: min(640px, 50vw); margin-top: 4.2vh; }
.play { flex: none; width: max(52px, 7.4vh); height: max(52px, 7.4vh); border-radius: 50%; background: var(--paper); color: var(--ink);
  display: grid; place-items: center; transition: transform .15s ease, background .2s; }
.play:hover { transform: scale(1.05); }
.play:active { transform: scale(.96); }
.play svg { width: 38%; height: 38%; }
.play .i-pause, body.playing .play .i-play { display: none; }
body.playing .play .i-pause { display: block; }
.loop { flex: none; position: relative; width: max(42px, 5.6vh); height: max(42px, 5.6vh); border-radius: 50%;
  border: 1.5px solid var(--faint); color: var(--dim); display: grid; place-items: center; transition: border-color .2s, color .2s; }
.loop:hover { color: var(--paper); border-color: var(--dim); }
.loop svg { width: 44%; height: 44%; }
.loop::after { content: ""; position: absolute; bottom: -1.3vh; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
  border-radius: 50%; background: var(--red); opacity: 0; transition: opacity .2s; }
.loop[aria-pressed="true"] { color: var(--paper); border-color: var(--paper); }
.loop[aria-pressed="true"]::after { opacity: 1; }
.progress { flex: 1; min-width: 0; padding-top: 1.6vh; }
.vol-wrap { display: flex; align-items: center; gap: max(6px, 1vh); width: max(80px, 12vw); }
.mute { width: max(22px, 3vh); height: max(22px, 3vh); color: var(--dim); transition: color .2s; flex: none; display: grid; place-items: center; }
.mute:hover { color: var(--paper); }
.mute svg { width: 100%; height: 100%; }
.mute .i-mute, body.muted .mute .i-vol { display: none; }
body.muted .mute .i-mute { display: block; }
.times { display: flex; justify-content: space-between; margin-top: 1.1vh; font: 400 max(11px, 1.3vh)/1 var(--mono);
  letter-spacing: .1em; color: var(--dim); font-variant-numeric: tabular-nums; }
input[type=range] { --p: 0%; --b: 0%; -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 18px;
  margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px;
  background: linear-gradient(to right, var(--paper) var(--p), rgba(255,255,255,.38) var(--p), rgba(255,255,255,.38) var(--b), var(--faint) var(--b)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 3px;
  background: linear-gradient(to right, var(--paper) var(--p), rgba(255,255,255,.38) var(--p), rgba(255,255,255,.38) var(--b), var(--faint) var(--b)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%;
  background: var(--paper); border: 0; box-shadow: 0 0 0 0 rgba(215,25,33,.0); transition: transform .15s, box-shadow .15s; }
input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 0; }
input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { transform: scale(1.25); box-shadow: 0 0 0 4px rgba(215,25,33,.35); }

@media (orientation: portrait) {
  :root { --art: min(34vh, 62vw); }
  .controls { width: min(640px, 80vw); }
  h1, .artist { max-width: 86vw; }
}
@media (prefers-reduced-motion: reduce) {
  .art { transition: border-color .6s ease; }
}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="shade"></div>
<canvas id="viz" aria-hidden="true"></canvas>

<div class="corner r"><span id="fmt"></span><a id="dl" href="?dl=1">Download</a></div>

<main class="stage">
  <div class="art" id="art"><div class="fb"><span id="fbExt">♪</span></div><img id="artImg" alt=""></div>
  <h1 id="title">&nbsp;</h1>
  <p class="artist" id="artist">&nbsp;</p>
  <div class="controls">
    <button class="play" id="play" type="button" aria-label="Play">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect fill="currentColor" x="5" y="4" width="5" height="16" rx="1.2"/><rect fill="currentColor" x="14" y="4" width="5" height="16" rx="1.2"/></svg>
    </button>
    <div class="progress">
      <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="vol-wrap">
      <button class="mute" id="mute" type="button" aria-label="Mute" title="Mute (M)">
        <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>
      </button>
      <input id="vol" type="range" min="0" max="100" step="1" value="50" aria-label="Volume">
    </div>
    <button class="loop" id="loop" type="button" aria-pressed="false" aria-label="Loop" title="Loop (L)">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </div>
</main>

<audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<script id="cfg" type="application/json">{{ dict "bgUrl" $bgUrl "bg" $bgs "covers" $covers | toJson }}</script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var cfg = {};
  try { cfg = JSON.parse($('cfg').textContent) || {}; } catch (e) { cfg = {}; }

  var RAW = location.pathname + '?raw=1';   // the file itself (edge-cached); the bare URL is this page
  // Phones get the browser's own player - Caddy already sends them the file, this catches what the UA hides.
  if (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600) { location.replace(RAW); return; }

  var fileName = location.pathname.split('/').pop() || '';
  try { fileName = decodeURIComponent(fileName); } catch (e) { /* keep it encoded */ }
  var ext = (/\.([a-z0-9]{2,5})$/i.exec(fileName) || [0, ''])[1].toUpperCase();
  var audio = $('audio'), seek = $('seek'), art = $('art'), artImg = $('artImg'), bg = $('bg');
  $('fmt').textContent = ext;
  $('fbExt').textContent = ext || '♪';

  /* ------------------------------------------------------------------ text */
  function guessFromName() {
    var base = fileName.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
    var m = /^(.+?)\s+[-–—]\s+(.+)$/.exec(base);   // "Artist - Title"
    return m ? { title: m[2], artist: m[1] } : { title: base || 'Untitled', artist: '' };
  }
  function setText(title, artist) {
    $('title').textContent = title; $('title').title = title;
    $('artist').textContent = artist || 'Unknown artist'; $('artist').title = artist || '';
    document.title = artist ? title + ' — ' + artist : title;
  }
  var guess = guessFromName();
  setText(guess.title, guess.artist);

  function clock(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }

  /* ------------------------------------------------------------------ tag reader */
  // Reads the title / artist / cover embedded in the file with a few Range requests (no library):
  // ID3v2 (MP3, AAC, also inside WAV / AIFF), FLAC, Ogg Vorbis / Opus / FLAC, MP4 / M4A, RIFF INFO.
  var CHUNK = 256 * 1024, MAX_TAG = 24 * 1024 * 1024, MAX_FETCH = 48 * 1024 * 1024;

  function Src(url) { this.url = url; this.segs = []; this.size = -1; this.fetched = 0; }
  Src.prototype.read = async function (off, len) {
    if (this.size >= 0) { if (off >= this.size) return new Uint8Array(0); len = Math.min(len, this.size - off); }
    for (var i = 0; i < this.segs.length; i++) {
      var s = this.segs[i];
      if (off >= s.off && off + len <= s.off + s.buf.length) return s.buf.subarray(off - s.off, off - s.off + len);
    }
    var want = Math.max(len, CHUNK);
    if (this.fetched + want > MAX_FETCH) throw new Error('tag too large');
    var r = await fetch(this.url, { headers: { Range: 'bytes=' + off + '-' + (off + want - 1) } });
    if (r.status === 416) { this.size = off; return new Uint8Array(0); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var start = off;
    if (r.status === 200) { start = 0; }            // server ignored the range: this is the whole file
    var buf = new Uint8Array(await r.arrayBuffer());
    if (r.status === 200) this.size = buf.length;
    else { var m = /\/(\d+)\s*$/.exec(r.headers.get('Content-Range') || ''); if (m) this.size = +m[1]; }
    this.fetched += buf.length;
    this.segs.push({ off: start, buf: buf });
    return buf.subarray(off - start, off - start + len);
  };

  function str(b, i, n) { var s = ''; for (var k = i; k < i + n && k < b.length; k++) s += String.fromCharCode(b[k]); return s; }
  function u32(b, i) { return ((b[i] << 24) >>> 0) + (b[i + 1] << 16) + (b[i + 2] << 8) + b[i + 3]; }
  function u32le(b, i) { return ((b[i + 3] << 24) >>> 0) + (b[i + 2] << 16) + (b[i + 1] << 8) + b[i]; }
  function u24(b, i) { return (b[i] << 16) + (b[i + 1] << 8) + b[i + 2]; }
  function syncsafe(b, i) { return ((b[i] & 0x7f) << 21) | ((b[i + 1] & 0x7f) << 14) | ((b[i + 2] & 0x7f) << 7) | (b[i + 3] & 0x7f); }
  var UTF8 = new TextDecoder('utf-8'), LATIN1 = new TextDecoder('latin1');
  function clean(s) { return s.replace(/\ufeff/g, '').split('\u0000').map(function (x) { return x.trim(); }).filter(Boolean).join(', '); }
  function unsync(b) {
    var out = new Uint8Array(b.length), j = 0;
    for (var i = 0; i < b.length; i++) { out[j++] = b[i]; if (b[i] === 0xff && b[i + 1] === 0x00) i++; }
    return out.subarray(0, j);
  }
  function sniff(b) {
    if (b[0] === 0xff && b[1] === 0xd8) return 'image/jpeg';
    if (b[0] === 0x89 && b[1] === 0x50) return 'image/png';
    if (str(b, 0, 4) === 'RIFF' && str(b, 8, 4) === 'WEBP') return 'image/webp';
    if (str(b, 0, 3) === 'GIF') return 'image/gif';
    if (str(b, 4, 8) === 'ftypavif') return 'image/avif';
    return '';
  }
  function addPic(meta, data, type) {
    var mime = sniff(data);
    if (mime && data.length > 64) meta.pics.push({ data: data, type: type, mime: mime });
  }
  function setField(meta, key, v) {
    if (!v) return;
    if (key === 'artist') { if (meta.artists.indexOf(v) < 0) meta.artists.push(v); }
    else if (!meta[key]) meta[key] = v;
  }

  function id3Text(enc, b) {
    if (enc === 0) return clean(LATIN1.decode(b));
    if (enc === 3) return clean(UTF8.decode(b));
    if (enc === 2) return clean(new TextDecoder('utf-16be').decode(b));
    var be = b[0] === 0xfe && b[1] === 0xff;
    return clean(new TextDecoder(be ? 'utf-16be' : 'utf-16le').decode(b));
  }
  function strEnd(b, i, enc) {
    if (enc === 1 || enc === 2) { for (; i + 1 < b.length; i += 2) if (b[i] === 0 && b[i + 1] === 0) return i; return b.length; }
    for (; i < b.length; i++) if (b[i] === 0) return i;
    return b.length;
  }
  var ID3_TEXT = { TIT2: 'title', TT2: 'title', TPE1: 'artist', TP1: 'artist', TPE2: 'albumArtist', TP2: 'albumArtist', TALB: 'album', TAL: 'album' };

  async function id3At(src, off, meta) {
    var h = await src.read(off, 10);
    if (h.length < 10 || str(h, 0, 3) !== 'ID3') return 0;
    var ver = h[3], flags = h[5], size = syncsafe(h, 6);
    var total = 10 + size + (flags & 0x10 ? 10 : 0);
    if (ver < 2 || ver > 4 || size > MAX_TAG) return total;
    var b = await src.read(off + 10, size);
    if (ver < 4 && (flags & 0x80)) b = unsync(b);
    var p = 0;
    if (ver === 3 && (flags & 0x40)) p = 4 + u32(b, 0);
    else if (ver === 4 && (flags & 0x40)) p = syncsafe(b, 0);
    var idLen = ver === 2 ? 3 : 4, hdr = ver === 2 ? 6 : 10;
    while (p + hdr <= b.length) {
      var id = str(b, p, idLen);
      if (!/^[A-Z0-9]+$/.test(id)) break;               // padding
      var fsz = ver === 2 ? u24(b, p + 3) : ver === 4 ? syncsafe(b, p + 4) : u32(b, p + 4);
      var ff = ver === 2 ? 0 : b[p + 9];                // format flags
      var d = b.subarray(p + hdr, p + hdr + fsz);
      p += hdr + fsz;
      if (ver === 4) {
        if (ff & 0x0c) continue;                        // compressed / encrypted
        if (ff & 0x40) d = d.subarray(1);               // group id
        if (ff & 0x01) d = d.subarray(4);               // data length indicator
        if (ff & 0x02) d = unsync(d);
      } else if (ver === 3) {
        if (ff & 0xc0) continue;
        if (ff & 0x20) d = d.subarray(1);
      }
      if (!d.length) continue;
      if (ID3_TEXT[id]) { setField(meta, ID3_TEXT[id], id3Text(d[0], d.subarray(1))); continue; }
      if (id === 'APIC' || id === 'PIC') {
        var enc = d[0], i = 1;
        if (id === 'APIC') i = strEnd(d, 1, 0) + 1; else i = 4;   // mime type (or v2.2's 3-letter format)
        var ptype = d[i++];
        i = strEnd(d, i, enc) + (enc === 1 || enc === 2 ? 2 : 1); // description
        addPic(meta, d.subarray(i), ptype);
      }
    }
    return total;
  }

  function flacPicture(d, meta) {
    if (d.length < 32) return;
    var i = 0, type = u32(d, i); i += 4;
    i += 4 + u32(d, i);              // mime
    i += 4 + u32(d, i);              // description
    i += 16;                         // width, height, depth, colours
    var n = u32(d, i); i += 4;
    addPic(meta, d.subarray(i, i + n), type);
  }
  function b64(bytes) {
    try {
      var bin = atob(LATIN1.decode(bytes).replace(/\s+/g, '')), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    } catch (e) { return new Uint8Array(0); }
  }
  var VORBIS_KEYS = { TITLE: 'title', ARTIST: 'artist', ALBUMARTIST: 'albumArtist', 'ALBUM ARTIST': 'albumArtist', ALBUM: 'album' };
  function vorbisComment(d, i, meta) {
    if (d.length < i + 8) return;
    i += 4 + u32le(d, i);            // vendor
    var n = u32le(d, i); i += 4;
    for (var k = 0; k < n && i + 4 <= d.length; k++) {
      var l = u32le(d, i); i += 4;
      var s = d.subarray(i, i + l); i += l;
      var eq = s.indexOf(0x3d);
      if (eq < 0) continue;
      var key = UTF8.decode(s.subarray(0, eq)).toUpperCase(), v = s.subarray(eq + 1);
      if (key === 'METADATA_BLOCK_PICTURE') flacPicture(b64(v), meta);
      else if (key === 'COVERART') addPic(meta, b64(v), 3);
      else if (VORBIS_KEYS[key]) setField(meta, VORBIS_KEYS[key], UTF8.decode(v).trim());
    }
  }
  async function flacAt(src, off, meta) {
    var p = off + 4;
    for (var n = 0; n < 128; n++) {

    var set = function (a, fn) { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) { /* unsupported */ } };
    set('play', play);
    set('pause', function () { audio.pause(); });
    set('seekbackward', function () { nudge(-10); });
    set('seekforward', function () { nudge(10); });
    set('seekto', function (d) { if (isFinite(audio.duration)) audio.currentTime = d.seekTime; });
  }

  try { setLoop(localStorage.getItem('strata.player.loop') === '1'); } catch (e) { setLoop(false); }
  var initialVol = 50;
  try { var saved = localStorage.getItem('strata.player.vol'); if (saved !== null) initialVol = parseInt(saved, 10); } catch (e) { /* ignore */ }
  setVol(isNaN(initialVol) ? 50 : initialVol);
  audio.src = RAW;
  // Autoplay when the browser allows it (it usually does after a click on a link to this file);
  // otherwise the play button waits for the visitor.
  var auto = audio.play();
  if (auto && auto.then) auto.then(function () { if (AC) graph(); }, function () { syncPlaying(); });
})();
</script>
