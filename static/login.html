<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata · Sign in</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles.css">
<meta name="strata-accent" content="{{ACCENT}}">
<script src="/boot.js"></script>
<script src="/login.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .wrap { min-height: calc(100vh / var(--z, 1)); display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background-image: linear-gradient(var(--color-divider) 2px, transparent 2px); background-size: 100% 66px; }
  .lock { width: 380px; max-width: 100%; background: var(--color-bg); border: 2px solid var(--color-text); box-shadow: var(--shadow-lg); }
  .head { padding: 18px 20px 16px; border-bottom: 2px solid var(--color-divider); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .head b { display: block; font-family: var(--font-heading); font-weight: 800; font-size: 26px; letter-spacing: -0.03em; line-height: 1; }
  .head span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent); }
  .bar { width: 44px; display: flex; gap: 3px; align-items: flex-end; height: 26px; }
  .bar i { flex: 1; background: var(--color-text); }
  .bar i:first-child { background: var(--color-accent); height: 40%; } .bar i:nth-child(2) { height: 70%; } .bar i:nth-child(3) { height: 100%; }
  form { padding: 18px 20px 20px; display: grid; gap: 14px; }
  label { display: grid; gap: 5px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-family: var(--font-heading); font-weight: 800; color: color-mix(in srgb, var(--color-text) 60%, transparent); }
  input { font: inherit; font-size: 15px; letter-spacing: 0; text-transform: none; font-weight: 400; font-family: var(--font-body); color: var(--color-text); background: transparent; border: 0; border-bottom: 2px solid var(--color-divider); padding: 8px 0; outline: none; border-radius: 0; }
  input:focus { border-bottom-color: var(--color-accent); }
  button { justify-content: space-between; font-size: 14px; margin-top: 6px; }
  .err { background: var(--color-accent); color: var(--color-bg); font-size: 12.5px; padding: 9px 20px; }
  .foot { padding: 10px 20px; border-top: 2px solid var(--color-divider); font-size: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="lock">
    <div class="head"><div><span>Strata</span><b>Sign in</b></div><div class="bar"><i></i><i></i><i></i></div></div>
    <!--ERROR-->
    <form method="post" action="/login">
      <label>Username<input name="user" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-block" type="submit"><span>Sign in</span><span>→</span></button>
    </form>
  </div>
</div>
</body>
</html>
