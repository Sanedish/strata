<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>502 Bad Gateway</title>
<!-- Strata error page. Colours are set in :root, the text is in <main>. -->
<style>
:root { --bg: #0b0b0d; --text: #ececf1; --dim: rgba(236, 236, 241, .7); --line: rgba(236, 236, 241, .18); --accent: #e65a46;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
@media (prefers-color-scheme: light) { :root { --bg: #f6f6f8; --text: #18181b; --dim: rgba(24, 24, 27, .68); --line: rgba(24, 24, 27, .16); } }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100%; color: var(--text); }
body { min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { width: min(620px, 100%); border-top: 4px solid var(--accent); padding: 20px 24px 24px;
  background: color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.code { font: 700 96px/1 var(--mono); letter-spacing: -.02em; margin: 0; color: var(--text); }
h1 { font-size: 22px; margin: 16px 0 4px; }
p { margin: 0; color: var(--dim); }
.path { margin-top: 20px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font: 13px/1.4 var(--mono); color: var(--dim); word-break: break-all; }
.path b { color: var(--text); font-weight: 400; }
a { display: inline-block; margin-top: 20px; color: var(--text); font: 700 13px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
a:hover { color: var(--accent); }
/* background: a 40 x 24 image stretched to the window and blurred; backgrounds.py makes them */
.bg { position: fixed; inset: -60px; z-index: -1; background: /*BG0*/url("data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAADQBgCdASooABgAPok2lUglIyIhOrZoAKARCWQAnTOJyngZE0HOXPd5Ez/ayUAIW95+2p4sl7o7y18u0MiGkAAA/tHwJcnl3sUpyeXc72LyXBpxBNuHE+JsxV5JrlrO2OIfIqtBwWMyPcRaogj+QG4pbs1Dr+gwfV3dXxGufBinmYhUqYAQntAUp7NKaRDgAAA=")/*BG0*/ center / cover no-repeat;
  filter: blur(32px); opacity: .5; }
@media (prefers-color-scheme: light) { .bg { opacity: .35; } }
.bg.photo { filter: blur(10px); opacity: .7; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main>
  <p class="code">502</p>
  <h1>Bad Gateway</h1>
  <p>The server could not reach the service behind this page. Please try again later.</p>
  <div class="path" id="where" hidden>URL: <b id="path"></b></div>
  <a href="/">Go to the home page</a>
</main>
