<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata · {{SITE}}</title>
<meta name="strata-instance" content="{{INSTANCE}}">
<meta name="strata-accent" content="{{ACCENT}}">
<link rel="icon" href="/favicon.ico">
<script src="boot.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.min.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><img src="brand.png" alt="" width="26" height="26" decoding="async"></div>
      <button class="site txt" data-act="siteMenu" title="Switch site · instance info"><b>STRATA</b><span>{{SITE}}</span></button>
    </div>
    <nav id="nav" data-scroll="nav"></nav>
    <div class="side-foot">
      <div class="conn" id="conn"><i></i><span>connecting…</span></div>
      <div class="who" id="who"></div>
      <div class="foot-row">
        <button class="btn btn-secondary" data-act="palette" title="Command palette (Ctrl K)"><span class="row"><svg class="ic" aria-hidden="true"><use href="icons.svg#i-command"/></svg><span class="lbl">Command</span></span><span class="lbl fw-400 o-60">Ctrl K</span></button>
        <button class="icbtn" data-act="navCollapse" id="navc" title="Collapse the sidebar ( [ )"><svg class="ic" aria-hidden="true"><use href="icons.svg#i-panel-left-close"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="col">
    <header>
      <div class="min-w0">
        <h4 id="title">Summary</h4>
        <div class="sub small dim ell" id="sub"></div>
      </div>
      <div class="fill"></div>
      <div class="seg-row" id="ranges"></div>
      <label class="qwrap"><svg class="ic" aria-hidden="true"><use href="icons.svg#i-search"/></svg><input id="q" class="input" placeholder="Filter requests…  ( / )" autocomplete="off" spellcheck="false"></label>
      <button class="tbtn ink" id="upbtn" data-act="go" data-arg="upload" title="Upload files (U)"><svg class="ic" aria-hidden="true"><use href="icons.svg#i-upload"/></svg>Upload</button>
      <button class="tbtn" id="bots" data-act="bots" title="Exclude bots from the aggregate stats (B)"><svg class="ic" aria-hidden="true"><use href="icons.svg#i-bot"/></svg><span>Bots</span></button>
      <button class="icbtn" id="themebtn" data-act="themeCycle" title="Theme: light / dark / system (T)"><svg class="ic" aria-hidden="true"><use href="icons.svg#i-moon"/></svg></button>
      <button class="icbtn" id="pause" data-act="pause" title="Pause live updates (Space)"><svg class="ic" aria-hidden="true"><use href="icons.svg#i-pause"/></svg></button>
      <button class="icbtn" data-act="help" title="Keyboard shortcuts (?)"><svg class="ic" aria-hidden="true"><use href="icons.svg#i-keyboard"/></svg></button>
    </header>
    <div class="vitals" id="vitals"></div>
    <main id="main"></main>
    <footer id="foot"></footer>
  </div>
</div>
<div id="overlay"></div>
<div id="toasts"></div>
<input type="file" id="upf" multiple hidden>
<input type="file" id="updir" webkitdirectory multiple hidden>
<script src="app.js"></script>
<script src="storage.js"></script>
<script src="control.js"></script>
<script src="network.js"></script>
<script src="media.js"></script>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/xml/xml.min.js"></script>
<script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
<script src="vendor/codemirror/mode/css/css.min.js"></script>
<script src="vendor/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="vendor/codemirror/mode/python/python.min.js"></script>
<script src="vendor/codemirror/mode/markdown/markdown.min.js"></script>
<script src="vendor/codemirror/addon/edit/matchbrackets.min.js"></script>
<script src="vendor/codemirror/addon/edit/closebrackets.min.js"></script>
<script src="vendor/codemirror/addon/edit/matchtags.min.js"></script>
<script src="vendor/codemirror/addon/selection/active-line.min.js"></script>
<script src="vendor/codemirror/addon/search/searchcursor.min.js"></script>
<script src="vendor/codemirror/addon/search/search.min.js"></script>
<script src="vendor/codemirror/addon/dialog/dialog.min.js"></script>
<script src="admin.js"></script>
<script src="office.js"></script>
<script src="layout.js"></script>
</body>
</html>
