<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata · {{SITE}}</title>
<meta name="strata-instance" content="{{INSTANCE}}">
<meta name="strata-accent" content="{{ACCENT}}">
<link rel="icon" href="/favicon.ico">
<script src="boot.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.min.css">
<style>
  /* zoom scales vh/vw too, so viewport-relative sizes go through --vh / --vw (1 % of the visible viewport).
     Control heights: --ctl for panel/header controls, --ctl-sm for toolbar pills and segmented buttons.
     Density (Settings › Appearance) scales row padding through --rp / --pp. */
  :root { --vh: calc(1vh / var(--ui-zoom, 1)); --vw: calc(1vw / var(--ui-zoom, 1)); --ctl: 32px; --ctl-sm: 28px;
    --rp: 5px; --pp: 16px; --side: 224px; --row: 30px; }
  :root[data-density="compact"] { --rp: 2px; --pp: 11px; --ctl: 28px; --ctl-sm: 24px; --row: 25px; }
  :root[data-density="comfy"] { --rp: 9px; --pp: 20px; --ctl: 36px; --ctl-sm: 32px; --row: 38px; }
  html, body { margin: 0; height: 100%; background: var(--color-bg); }
  body { color: var(--color-text); font-family: var(--font-body); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-text) 22%, transparent); border: 2px solid var(--color-bg); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { height: calc(100vh / var(--ui-zoom, 1)); min-height: 640px; display: grid; grid-template-columns: var(--side) 1fr; gap: 2px; background: var(--color-divider); overflow: hidden; }
  .app.navc { --side: 58px; }
  .side, .col { background: var(--color-bg); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .side { container: side / size; }

  .cap { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-family: var(--font-heading); font-weight: 800; color: color-mix(in srgb, var(--color-text) 50%, transparent); white-space: nowrap; }
  .cap.red { color: var(--color-accent-700); }
  .dim { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .small { font-size: 10.5px; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hot { color: var(--color-accent-700); }
  .ok { color: var(--color-ok); }
  .warn { color: var(--color-warn); }
  .h800 { font-family: var(--font-heading); font-weight: 800; }
  .mono { font-family: var(--font-mono); font-size: .92em; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .grow { flex: 1; min-width: 0; }

  /* sidebar */
  .brand { height: 66px; box-sizing: border-box; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 16px; border-bottom: 2px solid var(--color-divider); }
  .brand .logo { width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; }
  .brand .logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 4px; display: block; }
  .brand .logo i { flex: 1; background: var(--color-text); }
  .brand .logo i:first-child { background: var(--color-accent); height: 40%; } .brand .logo i:nth-child(2) { height: 70%; } .brand .logo i:nth-child(3) { height: 100%; }
  .brand .txt { min-width: 0; display: flex; flex-direction: column; }
  .brand b { font-family: var(--font-heading); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; line-height: 1.1; }
  .brand span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .site { cursor: pointer; border: 0; background: transparent; padding: 0; text-align: left; }
  .brand .site:hover span { color: var(--color-accent-700); }
  nav { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 6px; }
  .nav-h { padding: 12px 16px 6px; display: flex; justify-content: space-between; align-items: center; }
  .nav-item { display: grid; grid-template-columns: 3px 18px 1fr auto; align-items: center; gap: 9px; width: 100%; border: 0; cursor: pointer; text-align: left; font-family: var(--font-heading); font-weight: 800; font-size: 13.5px; padding: 6px 14px 6px 13px; background: transparent; color: var(--color-text); white-space: nowrap; }
  .nav-item .ic { width: 17px; height: 17px; opacity: .85; }
  .nav-item:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .nav-item .mark { width: 3px; height: 15px; }
  .nav-item .badge { font-size: 10.5px; font-weight: 400; font-family: var(--font-body); color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .nav-item.on { background: color-mix(in srgb, var(--color-accent) 12%, transparent); color: var(--color-accent-700); }
  .nav-item.on .mark { background: var(--color-accent); }
  .nav-item.on .badge { color: var(--color-accent-700); }
  .nav-item .badge.alert { color: var(--color-accent-700); font-weight: 600; }
  .nav-deep { margin-top: 10px; border-top: 2px solid var(--color-divider); }
  .nav-toggle { width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left; }
  .nav-toggle:hover { color: var(--color-text); }
  .app.navc .nav-toggle { display: none; }
  .side-foot { border-top: 2px solid var(--color-divider); padding: 10px 14px; flex: none; }
  .side-foot .btn { justify-content: space-between; font-size: 12px; padding: 6px 8px; margin: 0; }
  .conn { display: flex; align-items: center; gap: 7px; font-size: 10.5px; margin-bottom: 8px; }
  .conn i { width: 7px; height: 7px; background: var(--color-ok); flex: none; border-radius: 50%; }
  .conn.bad i { background: var(--color-accent); }
  .conn.paused i { background: var(--color-warn); }
  .foot-row { display: flex; gap: 6px; }
  .foot-row .btn { flex: 1; }
  .icbtn { display: inline-flex; align-items: center; justify-content: center; width: var(--ctl); height: var(--ctl); border: 1px solid var(--color-divider); background: transparent; cursor: pointer; flex: none; border-radius: var(--radius-sm); padding: 0; color: inherit; }
  .icbtn:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .icbtn.on { background: var(--color-text); color: var(--color-bg); border-color: var(--color-text); }
  .icbtn.sm { width: var(--ctl-sm); height: var(--ctl-sm); }
  .app.navc .brand .txt, .app.navc .nav-item > span:not(.mark), .app.navc .nav-h, .app.navc .side-foot .lbl, .app.navc .who, .app.navc .conn span { display: none; }
  .app.navc .brand { padding: 0; justify-content: center; }
  .app.navc .nav-item { grid-template-columns: 3px 18px; padding: 8px 0 8px 9px; gap: 9px; }
  .app.navc .nav-deep { margin-top: 4px; }
  .app.navc .side-foot { padding: 8px 6px; }
  .app.navc .foot-row { flex-direction: column; }
  @container side (max-height: 1000px) { .nav-h { padding: 9px 16px 4px; } .nav-item { padding-top: 4px; padding-bottom: 4px; } .nav-deep { margin-top: 6px; } }
  @container side (max-height: 820px) { .nav-h { padding: 6px 16px 2px; } .nav-item { padding-top: 3px; padding-bottom: 3px; font-size: 13px; } .nav-deep { margin-top: 3px; } .side-foot { padding: 7px 12px; } .conn, .who { margin-bottom: 5px; } }

  /* header */
  header { height: 66px; box-sizing: border-box; flex: none; border-bottom: 2px solid var(--color-divider); padding: 0 18px; display: flex; align-items: center; gap: 10px; }
  header h4 { margin: 0; font-size: 21px; letter-spacing: -0.02em; line-height: 1.15; display: flex; align-items: center; gap: 8px; }
  header h4 .ic { color: var(--color-accent); }
  .seg-row { display: flex; border: 1px solid var(--color-divider); flex: none; border-radius: var(--radius-sm); overflow: hidden; }
  .seg-row button { border: 0; background: transparent; cursor: pointer; font-family: var(--font-heading); font-weight: 800; font-size: 11.5px; padding: 5px 10px; min-height: calc(var(--ctl-sm) - 2px); line-height: 1.2; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .seg-row button + button { border-left: 1px solid var(--color-divider); }
  .seg-row button:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .seg-row button.on { background: var(--color-text); color: var(--color-bg); }
  .tbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--color-divider); font-size: 12px; line-height: 1.2; padding: 6px 11px; white-space: nowrap; flex: none; background: transparent; cursor: pointer; font-family: var(--font-heading); font-weight: 800; border-radius: var(--radius-sm); }
  .tbtn:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .tbtn.on { background: var(--color-accent); color: var(--color-on-accent); border-color: var(--color-accent); }
  .tbtn.ink { background: var(--color-text); color: var(--color-bg); }
  header .seg-row button { min-height: calc(var(--ctl) - 2px); }
  header .tbtn, header .btn, header .icbtn { height: var(--ctl); }
  .qwrap { position: relative; display: flex; align-items: center; }
  .qwrap .ic { position: absolute; left: 9px; opacity: .55; pointer-events: none; }
  #q { width: 200px; height: var(--ctl); min-height: var(--ctl); font-size: 12.5px; padding: 4px 10px 4px 30px; }

  /* vitals */
  .vitals { display: grid; grid-template-columns: repeat(var(--vcols, 6), 1fr); gap: 2px; background: var(--color-divider); border-bottom: 2px solid var(--color-divider); flex: none; }
  .vital { background: var(--color-bg); padding: 10px 14px 11px; min-width: 0; cursor: default; }
  .vital .cap { display: flex; align-items: center; gap: 5px; }
  .vital .val { font-family: var(--font-heading); font-weight: 800; font-size: 28px; line-height: 1.08; letter-spacing: -0.03em; margin: 2px 0 3px; white-space: nowrap; }
  .vital .val small { font-size: 14px; letter-spacing: 0; margin-left: 3px; }
  .segs { display: flex; gap: 1.5px; height: 9px; margin-bottom: 5px; }
  .segs span { flex: 1; background: var(--color-neutral-300); }
  .segs span.on { background: var(--color-text); }
  .segs span.warn { background: var(--color-accent); }
  .segs.s5 { height: 5px; margin: 4px 0 0; }
  .segs.s7 { height: 7px; margin: 4px 0 0; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  main > div:has(> .angrid) { overflow-y: auto; }
  footer { border-top: 2px solid var(--color-divider); padding: 6px 18px; display: flex; align-items: center; gap: 16px; font-size: 11px; flex: none; color: color-mix(in srgb, var(--color-text) 60%, transparent); white-space: nowrap; overflow: hidden; }
  footer .link, .link { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--color-text) 30%, transparent); text-underline-offset: 3px; white-space: nowrap; }
  footer .link:hover, .link:hover { color: var(--color-accent-700); }
  footer .clock { color: var(--color-text); font-family: var(--font-heading); font-weight: 800; }

  /* panels */
  .grid2 { display: grid; gap: 2px; background: var(--color-divider); min-height: 0; }
  .panel { background: var(--color-bg); padding: var(--pp) calc(var(--pp) + 2px); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .ph { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; margin-bottom: 6px; flex: none; }
  .ph h5 { margin: 0; font-size: 15px; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .legend { display: flex; gap: 14px; font-size: 10.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent); margin-bottom: 6px; flex: none; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 2px; background: var(--color-text); }
  .chart { position: relative; flex: 1; min-height: 80px; border: 1px solid var(--color-divider); }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .chart .ymax { position: absolute; left: 5px; top: 3px; font-size: 9.5px; color: color-mix(in srgb, var(--color-text) 50%, transparent); pointer-events: none; }
  .chart .cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--color-accent); pointer-events: none; }
  .chart .tip { position: absolute; top: 8px; background: var(--color-text); color: var(--color-bg); font-size: 11px; padding: 6px 8px; pointer-events: none; white-space: nowrap; z-index: 2; line-height: 1.45; border-radius: var(--radius-sm); }
  .axis { display: flex; justify-content: space-between; gap: 10px; font-size: 10.5px; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-top: 5px; flex: none; white-space: nowrap; overflow: hidden; }
  .strip { display: flex; gap: 2px; background: var(--color-divider); margin-top: 10px; flex: none; overflow-x: auto; }
  .chip { background: var(--color-bg); padding: 4px 7px 5px; width: 64px; flex: none; }
  .chip b { display: block; font-family: var(--font-heading); font-weight: 800; font-size: 9.5px; line-height: 1.25; }
  .chip span { display: block; font-size: 9.5px; line-height: 1.25; }
  .strip .rest { background: var(--color-bg); padding: 4px 8px; flex: 1; min-width: 70px; font-size: 9.5px; color: color-mix(in srgb, var(--color-text) 50%, transparent); white-space: nowrap; }
  .mini-h { display: grid; gap: 0 8px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-family: var(--font-heading); font-weight: 800; color: color-mix(in srgb, var(--color-text) 50%, transparent); border-bottom: 2px solid var(--color-divider); padding-bottom: 4px; flex: none; }
  .mini-r { display: grid; gap: 0 8px; font-size: 12.5px; padding: var(--rp) 0; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 12%, transparent); cursor: pointer; }
  .mini-r:hover, .trow:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .r { text-align: right; }
  .bigs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: var(--color-divider); border-bottom: 2px solid var(--color-divider); flex: none; }
  .big { background: var(--color-bg); padding: 12px 16px 13px; min-width: 0; }
  .big h5 { margin: 0; font-size: 14px; white-space: nowrap; }
  .big svg { width: 100%; height: 62px; display: block; border: 1px solid var(--color-divider); }
  .readouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .readouts .cap { font-size: 9.5px; letter-spacing: .12em; }
  .readouts div div:last-child { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* tables */
  .tbar { display: flex; align-items: center; gap: 7px; padding: 9px 18px; border-bottom: 2px solid var(--color-divider); flex-wrap: wrap; flex: none; }
  .tbar .input { width: auto; height: var(--ctl-sm); min-height: var(--ctl-sm); padding: 3px 8px; font-size: 12.5px; }
  .tbar select.input { padding-right: 22px; }
  .tbar > span[style*="display:flex"] { align-items: center; }
  .tbar #fsearch, .tbar #blq { flex: 1 1 130px; max-width: 260px; }
  .tbar > span.small:first-child { flex: 1 1 320px; min-width: 0; }
  .twrap { flex: 1; min-height: 0; overflow: auto; }
  .thead { position: sticky; top: 0; z-index: 1; background: var(--color-bg); display: grid; gap: 0 10px; padding: 6px 18px; border-bottom: 2px solid var(--color-divider); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-family: var(--font-heading); font-weight: 800; color: color-mix(in srgb, var(--color-text) 50%, transparent); min-width: max-content; }
  .thead > div { position: relative; min-width: 0; display: flex; align-items: center; }
  .thead > div.r { justify-content: flex-end; }
  .thead button { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-flex; gap: 3px; align-items: center; }
  .thead button.on { color: var(--color-accent-700); }
  .thead .grip { position: absolute; right: -6px; top: -7px; bottom: -7px; width: 11px; cursor: col-resize; border-right: 1px solid color-mix(in srgb, var(--color-text) 18%, transparent); }
  .trow { display: grid; gap: 0 10px; padding: var(--rp) 18px; font-size: 12.5px; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 11%, transparent); cursor: default; min-width: max-content; align-items: center; }
  .zebra .trow:nth-child(even) { background: color-mix(in srgb, var(--color-text) 3%, transparent); }
  .trow.click { cursor: pointer; }
  .trow.sel { background: color-mix(in srgb, var(--color-accent) 13%, transparent) !important; }
  .trow.fresh { animation: fresh 1.6s ease-out; }
  @keyframes fresh { from { background: color-mix(in srgb, var(--color-accent) 16%, transparent); } }
  .trow > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: inline-block; height: 7px; background: var(--color-text); vertical-align: middle; }
  .empty { padding: 28px 18px; font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .empty.big { display: grid; place-items: center; gap: 8px; text-align: center; padding: 48px 20px; }
  .empty.big .ic { opacity: .5; }

  .split { display: grid; gap: 2px; background: var(--color-divider); flex: 1; min-height: 0; position: relative; }
  .pane-grip { position: absolute; top: 0; bottom: 0; width: 10px; z-index: 4; cursor: col-resize; touch-action: none; outline: none; }
  .pane-grip::after { content: ''; position: absolute; top: 0; bottom: 0; right: 8px; width: 2px; transition: background .12s; }
  .pane-grip:hover::after, .pane-grip.drag::after, .pane-grip:focus-visible::after { background: var(--color-accent); }
  html.pane-dragging, html.pane-dragging * { cursor: col-resize !important; user-select: none !important; }
  .aside { background: var(--color-bg); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .aside .pad { padding: 14px 16px 10px; flex: none; }
  .aside h5 { margin: 3px 0 0; font-size: 16px; }
  .aside svg.spark { width: 100%; height: 78px; display: block; border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider); flex: none; }
  .gauge { margin-bottom: 10px; }
  .gauge .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11.5px; }
  .gauge .row b { font-family: var(--font-heading); font-weight: 800; font-size: 12.5px; white-space: nowrap; }
  .loglines { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }
  .logline { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; padding: 5px 0; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent); }
  .logline span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: color-mix(in srgb, var(--color-text) 78%, transparent); }
  .logline span:last-child { white-space: nowrap; color: color-mix(in srgb, var(--color-text) 55%, transparent); }

  .stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--color-divider); border-bottom: 2px solid var(--color-divider); flex: none; }
  .stats2 > div { background: var(--color-bg); padding: 9px 12px; min-width: 0; }
  .stats2 .v { font-family: var(--font-heading); font-weight: 800; font-size: 16px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: flex; border-bottom: 2px solid var(--color-divider); flex: none; overflow-x: auto; }
  .tabs button { flex: 1; border: 0; cursor: pointer; font-family: var(--font-heading); font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 6px; background: transparent; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; justify-content: center; }
  .tabs button.on { background: var(--color-text); color: var(--color-bg); }
  .kv { display: grid; grid-template-columns: 104px 1fr; gap: 4px 10px; font-size: 12px; padding: 10px 16px 20px; overflow-y: auto; min-height: 0; flex: 1; align-content: start; }
  .kv > span:nth-child(odd) { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .kv > span:nth-child(even) { word-break: break-all; }

  .band { flex: 1; min-height: 64px; display: flex; flex-direction: column; margin-bottom: 12px; }
  .slabs { display: flex; gap: 2px; align-items: flex-end; flex: 1; min-height: 34px; border-bottom: 2px solid var(--color-divider); }
  .slabs span { flex: 1; min-height: 1px; }
  .stack { display: flex; flex-direction: column-reverse; flex: 1; height: 100%; }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; background: var(--color-divider); border-bottom: 2px solid var(--color-divider); flex: none; }
  .kpis > div { background: var(--color-bg); padding: 11px 14px 12px; min-width: 0; }
  .kpis .val { font-family: var(--font-heading); font-weight: 800; font-size: 24px; letter-spacing: -0.03em; margin: 3px 0 2px; white-space: nowrap; }
  .setup { padding: 22px 24px; max-width: 820px; font-size: 13.5px; line-height: 1.55; overflow-y: auto; }
  .setup h5 { font-size: 17px; margin: 0 0 6px; }
  .setup ol { padding-left: 20px; margin: 10px 0; }
  .setup li { margin-bottom: 6px; }
  .setup pre { background: var(--color-surface); border: 1px solid var(--color-divider); padding: 10px 12px; font-size: 12px; overflow-x: auto; }

  /* insights */

  /* lightbox */
