<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Created</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles.css">
<meta name="strata-accent" content="{{ACCENT}}">
<script src="/boot.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .wrap { min-height: calc(100vh / var(--z, 1)); display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background-image: linear-gradient(var(--color-divider) 2px, transparent 2px); background-size: 100% 66px; }
  .lock { width: min(420px, 100%); background: var(--color-bg); border: 2px solid var(--color-text); box-shadow: var(--shadow-lg); }
  .head { padding: 18px 20px 16px; border-bottom: 2px solid var(--color-divider); }
  .head b { display: block; font-family: var(--font-heading); font-weight: 800; font-size: 26px; letter-spacing: -0.03em; line-height: 1; }
  .head span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent); }
  .body { padding: 18px 20px 20px; display: grid; gap: 14px; }
  p { font-size: 13px; line-height: 1.5; margin: 0; color: color-mix(in srgb, var(--color-text) 75%, transparent); }
  ol { margin: 0; padding: 12px 16px 12px 40px; border: 2px solid var(--color-divider); columns: 2; font-family: var(--font-mono); font-size: 14px; line-height: 1.8; }
  a.btn { justify-content: space-between; font-size: 14px; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lock">
    <div class="head"><span>First-Time Setup</span><b>Save your recovery codes</b></div>
    <div class="body">
      <p>If you lose your phone, each code works once instead of a code from the app. They are shown only now: keep them somewhere safe.</p>
      <ol><!--CODES--></ol>
      <a class="btn btn-primary btn-block" href="/login?e=owner"><span>Sign in</span><span>→</span></a>
    </div>
  </div>
</div>
</body>
</html>
