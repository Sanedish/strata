<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND}} · Two-factor code</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles.css">
<meta name="strata-accent" content="{{ACCENT}}">
<script src="/boot.js"></script>
<script src="/login.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .wrap { min-height: calc(100vh / var(--z, 1)); display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background-image: linear-gradient(var(--color-divider) 2px, transparent 2px); background-size: 100% 66px; }
  .lock { width: min(380px, 100%); background: var(--color-bg); border: 2px solid var(--color-text); box-shadow: var(--shadow-lg); }
  .head { padding: 18px 20px 16px; border-bottom: 2px solid var(--color-divider); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .head b { display: block; font-family: var(--font-heading); font-weight: 800; font-size: 26px; letter-spacing: -0.03em; line-height: 1; }
  .head span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent); }
  .bar { width: 44px; display: flex; gap: 3px; align-items: flex-end; height: 26px; }
  .bar i { flex: 1; background: var(--color-text); }
  .bar i:first-child { background: var(--color-accent); height: 40%; } .bar i:nth-child(2) { height: 70%; } .bar i:nth-child(3) { height: 100%; }
  form { padding: 18px 20px 20px; display: grid; gap: 14px; }
  p { margin: 0; font-size: 13px; line-height: 1.5; color: color-mix(in srgb, var(--color-text) 72%, transparent); }
  label.code { display: grid; gap: 5px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-family: var(--font-heading); font-weight: 800; color: color-mix(in srgb, var(--color-text) 60%, transparent); }
  input[name=code] { font-family: var(--font-heading); font-weight: 800; font-size: 30px; letter-spacing: .28em; color: var(--color-text); background: transparent; border: 0; border-bottom: 2px solid var(--color-divider); padding: 6px 0; outline: none; border-radius: 0; width: 100%; }
  input[name=code]:focus { border-bottom-color: var(--color-accent); }
  label.trust { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 75%, transparent); cursor: pointer; }
  label.trust input { accent-color: var(--color-accent); width: 16px; height: 16px; }
  button { justify-content: space-between; font-size: 14px; margin-top: 4px; }
  .err { background: var(--color-accent); color: var(--color-bg); font-size: 12.5px; padding: 9px 20px; }
  .foot { padding: 10px 20px; border-top: 2px solid var(--color-divider); font-size: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .foot a { color: inherit; }
</style>
<link rel="stylesheet" href="/custom.css">
</head>
<body>
<div class="wrap">
  <div class="lock">
    <div class="head"><div><span>{{BRAND}} · step 2 of 2</span><b>Your code</b></div><div class="bar"><i></i><i></i><i></i></div></div>
    <!--ERROR-->
    <form method="post" action="/login/2fa">
      <p>Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
      <label class="code">Code<input name="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" maxlength="14" required autofocus></label>
      <label class="trust"><input type="checkbox" name="trust" value="1"> Trust this browser for 30 days</label>
      <button class="btn btn-primary btn-block" type="submit"><span>Verify</span><span>→</span></button>
    </form>
    <div class="foot">Wrong account? <a href="/login">Start over</a> · codes change every 30 seconds</div>
  </div>
</div>
</body>
</html>
